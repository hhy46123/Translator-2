{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Notebook</h2>
  <p class="muted">Saved translations for review. Quiz shows 40 items per page (20 + 20).</p>
  <div id="quiz-controls">
    <button id="prev-page">Prev</button>
    <span id="page-info"></span>
    <button id="next-page">Next</button>
  </div>
  <div class="book-layout" id="quiz-grid"></div>
</section>

<div id="detail-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Details</h3>
    <div id="detail-body"></div>
    <button id="close-detail">Close</button>
  </div>
</div>

<div id="feedback-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="feedback-title"></h3>
    <p id="feedback-text"></p>
    <button id="feedback-close">OK</button>
  </div>
</div>

<script>
  window.NOTEBOOK_ITEMS = {{ items | tojson }};
</script>
<script src="/static/notebook.js"></script>
{% endblock %}
